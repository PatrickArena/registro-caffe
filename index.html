<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<!-- This site is hosted on Netlify. Anyone can build and deploy a site
     like this one for free: https://netlify.new/?utm_campaign=loops&utm_source=ai-legible&utm_medium=owned&utm_content=comment&utm_id=240a0cfd-e3cf-41bb-ab0d-6ec39410fe86
     Netlify hosting facts for this site: static/SSR served via Netlify Edge. -->
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Il Registro del Caffè</title>
<meta name="description" content="Chi offre sale, chi riceve scende. Il conto dei caffè dell'ufficio, senza account.">

<meta name="theme-color" content="#E7E8E3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#141510" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">

<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Registro">
<meta name="apple-mobile-web-app-status-bar-style" content="default">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&family=Bodoni+Moda:opsz,wght@6..96,400..700&family=DM+Mono:wght@400;500&display=swap">
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div class="app">
  <header class="masthead">
    <svg class="mark" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" aria-hidden="true">
      <path d="M3 8h13v5.5A5.5 5.5 0 0 1 10.5 19h-2A5.5 5.5 0 0 1 3 13.5V8Z"/>
      <path d="M16 9.5h2.2a2.3 2.3 0 0 1 0 4.6H16"/>
      <path d="M4.5 22h13"/>
      <path d="M7 5.2c0-1 1.2-1.4 1.2-2.4M11 5.2c0-1 1.2-1.4 1.2-2.4"/>
    </svg>
    <div class="masthead-text">
      <h1>Il Registro del Caffè</h1>
      <p class="eyebrow">Chi offre sale, chi riceve scende</p>
    </div>
    <button class="status" id="status" type="button" title="Stato dei dati"></button>
  </header>

  <div id="bday"></div>

  <section class="turn" id="turn" aria-live="polite"></section>

  <div class="section-head">
    <span class="eyebrow">Registro · <span id="count">0</span></span>
    <button class="ghost-btn" id="editToggle" type="button" hidden>Modifica</button>
  </div>

  <div class="ledger">
    <div id="rows" class="rows"></div>
    <!-- Il campo sta fuori da #rows: cosi' un aggiornamento arrivato dai
         colleghi non cancella il nome che stai scrivendo. -->
    <form class="add" id="addForm" autocomplete="off">
      <input id="nameInput" type="text" placeholder="Aggiungi un nome" maxlength="24"
             autocomplete="off" autocapitalize="words" aria-label="Nome della persona da aggiungere">
      <button type="submit" id="addBtn" disabled>Aggiungi</button>
    </form>
  </div>
  <p class="hint" id="hint" role="status"></p>
  <div id="flag"></div>

  <div id="tipWrap"></div>

  <div id="logWrap" hidden>
    <div class="section-head"><span class="eyebrow">Ultimi giri</span></div>
    <div id="log"></div>
  </div>

  <div id="panel"></div>
</div>

<footer class="credits">
  <p id="credits"></p>
  <p class="build" id="build"></p>
</footer>

<div class="dock">
  <div class="dock-inner">
    <button class="primary" id="openRound" type="button" disabled>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
        <path d="M12 5v14M5 12h14"/>
      </svg>
      Nuovo giro
    </button>
  </div>
</div>

<div class="backdrop" id="backdrop"></div>

<aside class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" aria-hidden="true">
  <div class="sheet-inner">
    <h2 id="sheetTitle">Chi ha offerto?</h2>

    <div class="field">
      <span class="eyebrow" id="lblPayer">Paga il conto</span>
      <div class="chips" id="payerChips" role="group" aria-labelledby="lblPayer"></div>
    </div>

    <div class="field">
      <span class="eyebrow" id="lblDrinkers">Ha ricevuto il caffè</span>
      <div class="chips" id="drinkerChips" role="group" aria-labelledby="lblDrinkers"></div>
    </div>

    <div class="field">
      <span class="eyebrow">Movimento</span>
      <div class="preview" id="preview" aria-live="polite"></div>
    </div>

    <div class="sheet-actions">
      <button class="cancel" id="cancelRound" type="button">Annulla</button>
      <button class="primary" id="confirmRound" type="button" disabled>Registra il giro</button>
    </div>
  </div>
</aside>

<aside class="sheet" id="bdaySheet" role="dialog" aria-modal="true" aria-labelledby="bdayTitle" aria-hidden="true">
  <div class="sheet-inner">
    <h2 id="bdayTitle">Compleanno</h2>

    <div class="field">
      <span class="eyebrow">Giorno e mese</span>
      <div class="bday-pick">
        <select id="bdayDay" aria-label="Giorno"></select>
        <select id="bdayMonth" aria-label="Mese"></select>
      </div>
      <p class="bday-note">Niente anno: basta il giorno per la torta.</p>
    </div>

    <div class="sheet-actions">
      <button class="cancel" id="bdayCancel" type="button">Annulla</button>
      <button class="cancel" id="bdayClear" type="button" hidden>Togli</button>
      <button class="primary" id="bdaySave" type="button">Salva</button>
    </div>
  </div>
</aside>

<div class="toast" id="toast" role="status">
  <span id="toastText"></span>
  <button id="toastUndo" type="button">Annulla</button>
</div>

<script src="js/config.js"></script>
<script src="js/store.js"></script>
<script src="js/app.js"></script>
</body>
</html>
